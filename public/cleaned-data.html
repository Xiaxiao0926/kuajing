<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清洗数据详情 - 坪山优选价格分析</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header h1 { font-size: 1.4rem; margin-bottom: 8px; }
        .header p { font-size: 0.9rem; opacity: 0.9; }
        .header a { color: white; text-decoration: none; font-size: 0.85rem; opacity: 0.8; }
        .header a:hover { opacity: 1; text-decoration: underline; }
        
        .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 8px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-card .number { font-size: 1.8rem; font-weight: 700; color: #667eea; }
        .stat-card .label { font-size: 0.8rem; color: #6b7280; margin-top: 4px; }
        
        .filters { background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .filter-group { flex: 1; min-width: 200px; }
        .filter-group label { display: block; font-size: 0.8rem; color: #6b7280; margin-bottom: 4px; }
        .filter-group input, .filter-group select { width: 100%; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.85rem; }
        
        .section { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .section-title { font-size: 1rem; font-weight: 600; color: #1f2937; margin-bottom: 12px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
        .stats-section { background: #f9fafb; border-radius: 6px; padding: 12px; }
        .stats-section h4 { font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 8px; }
        .stats-list { max-height: 200px; overflow-y: auto; }
        .stats-item { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.8rem; border-bottom: 1px solid #e5e7eb; }
        .stats-item:last-child { border-bottom: none; }
        .stats-item .name { color: #4b5563; }
        .stats-item .count { font-weight: 600; color: #667eea; }
        
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { background: #f9fafb; padding: 10px 8px; text-align: left; font-weight: 600; color: #374151; border-bottom: 2px solid #e5e7eb; position: sticky; top: 0; }
        td { padding: 10px 8px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
        tr:hover { background: #f9fafb; }
        
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 500; }
        .badge-brand { background: #dbeafe; color: #1d4ed8; }
        .badge-type { background: #dcfce7; color: #166534; }
        .badge-capacity { background: #fef3c7; color: #92400e; }
        
        .title-cell { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .shop-cell { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .pagination { display: flex; justify-content: center; gap: 4px; margin-top: 16px; }
        .page-btn { background: white; border: 1px solid #d1d5db; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .page-btn.active { background: #667eea; color: white; border-color: #667eea; }
        .page-btn:hover:not(.active) { background: #f3f4f6; }
        
        .loading { text-align: center; padding: 40px; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 清洗后的市场价数据</h1>
        <p>查看所有清洗后的市场报价数据，支持筛选和搜索</p>
        <p style="margin-top: 8px;"><a href="/">← 返回价格分析主页面</a></p>
    </div>
    
    <div class="container">
        <div class="stats" id="stats"></div>
        
        <div class="filters">
            <div class="filter-row">
                <div class="filter-group">
                    <label>品牌筛选</label>
                    <select id="brandFilter" onchange="applyFilters()">
                        <option value="">全部品牌</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>产品类型</label>
                    <select id="typeFilter" onchange="applyFilters()">
                        <option value="">全部类型</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>关键词搜索</label>
                    <input type="text" id="searchInput" placeholder="搜索标题..." onkeyup="applyFilters()">
                </div>
                <div class="filter-group">
                    <label>价格区间</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="number" id="minPrice" placeholder="最低价" onchange="applyFilters()" style="width: 50%;">
                        <input type="number" id="maxPrice" placeholder="最高价" onchange="applyFilters()" style="width: 50%;">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">📋 数据列表 <span id="totalCount"></span></div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>品牌</th>
                            <th>标题</th>
                            <th>价格</th>
                            <th>规格</th>
                            <th>产品类型</th>
                            <th>店铺</th>
                            <th>来源文件</th>
                        </tr>
                    </thead>
                    <tbody id="dataBody">
                        <tr><td colspan="8" class="loading">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script>
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const pageSize = 50;
        
        let brands = new Set();
        let types = new Set();
        
        async function loadData() {
            try {
                const response = await fetch('/api/cleaned');
                allData = await response.json();
                
                const summaryRes = await fetch('/api/cleaned-summary');
                const summary = await summaryRes.json();
                
                renderStats(summary);
                
                allData.forEach(item => {
                    if (item.brand) brands.add(item.brand);
                    if (item.product_type) {
                        item.product_type.split('|').forEach(t => {
                            if (t) types.add(t);
                        });
                    }
                });
                
                populateFilters();
                
                filteredData = [...allData];
                renderTable();
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('dataBody').innerHTML = '<tr><td colspan="8" class="loading">加载失败，请刷新页面</td></tr>';
            }
        }
        
        function renderStats(summary) {
            const statsHTML = `
                <div class="stat-card">
                    <div class="number">${summary.total}</div>
                    <div class="label">总记录数</div>
                </div>
                <div class="stat-card">
                    <div class="number">${Object.keys(summary.brandCount || {}).length}</div>
                    <div class="label">品牌数</div>
                </div>
                <div class="stat-card">
                    <div class="number">${Object.keys(summary.typeCount || {}).length}</div>
                    <div class="label">产品类型数</div>
                </div>
                <div class="stat-card">
                    <div class="number">${Object.keys(summary.fileCount || {}).length}</div>
                    <div class="label">来源文件数</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHTML;
            
            const statsHTML2 = `
                <div class="stats-section">
                    <h4>🔥 热门品牌</h4>
                    <div class="stats-list">
                        ${Object.entries(summary.brandCount || {})
                            .sort((a, b) => b[1] - a[1])
                            .slice(0, 15)
                            .map(([brand, count]) => `
                                <div class="stats-item">
                                    <span class="name">${brand || '未知'}</span>
                                    <span class="count">${count}</span>
                                </div>
                            `).join('')}
                    </div>
                </div>
                <div class="stats-section">
                    <h4>📦 产品类型分布</h4>
                    <div class="stats-list">
                        ${Object.entries(summary.typeCount || {})
                            .sort((a, b) => b[1] - a[1])
                            .slice(0, 15)
                            .map(([type, count]) => `
                                <div class="stats-item">
                                    <span class="name">${type}</span>
                                    <span class="count">${count}</span>
                                </div>
                            `).join('')}
                    </div>
                </div>
                <div class="stats-section">
                    <h4>📁 来源文件分布</h4>
                    <div class="stats-list">
                        ${Object.entries(summary.fileCount || {})
                            .sort((a, b) => b[1] - a[1])
                            .slice(0, 10)
                            .map(([file, count]) => `
                                <div class="stats-item">
                                    <span class="name" style="word-break: break-all;">${file.slice(0, 30)}...</span>
                                    <span class="count">${count}</span>
                                </div>
                            `).join('')}
                    </div>
                </div>
            `;
            
            const existingStats = document.querySelector('.stats');
            const sectionsDiv = document.createElement('div');
            sectionsDiv.className = 'stats-grid';
            sectionsDiv.innerHTML = statsHTML2;
            existingStats.parentNode.insertBefore(sectionsDiv, existingStats.nextSibling);
        }
        
        function populateFilters() {
            const brandSelect = document.getElementById('brandFilter');
            const typeSelect = document.getElementById('typeFilter');
            
            [...brands].sort().forEach(brand => {
                if (brand) {
                    brandSelect.innerHTML += `<option value="${brand}">${brand}</option>`;
                }
            });
            
            [...types].sort().forEach(type => {
                if (type) {
                    typeSelect.innerHTML += `<option value="${type}">${type}</option>`;
                }
            });
        }
        
        function applyFilters() {
            const brandFilter = document.getElementById('brandFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
            
            filteredData = allData.filter(item => {
                if (brandFilter && item.brand !== brandFilter) return false;
                if (typeFilter && !item.product_type.includes(typeFilter)) return false;
                if (search && !item.title.toLowerCase().includes(search)) return false;
                if (item.price < minPrice || item.price > maxPrice) return false;
                return true;
            });
            
            currentPage = 1;
            renderTable();
        }
        
        function renderTable() {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = filteredData.slice(start, end);
            
            document.getElementById('totalCount').textContent = `(${filteredData.length} 条)`;
            
            const tbody = document.getElementById('dataBody');
            
            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="loading">暂无数据</td></tr>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            tbody.innerHTML = pageData.map((item, index) => `
                <tr>
                    <td>${start + index + 1}</td>
                    <td>${item.brand ? `<span class="badge badge-brand">${item.brand}</span>` : '-'}</td>
                    <td class="title-cell" title="${item.title}">${item.title}</td>
                    <td style="font-weight: 600; color: #ef4444;">¥${item.price}</td>
                    <td>${item.capacity || '-'}</td>
                    <td>${item.product_type ? item.product_type.split('|').map(t => `<span class="badge badge-type">${t}</span>`).join(' ') : '-'}</td>
                    <td class="shop-cell" title="${item.shop}">${item.shop || '-'}</td>
                    <td style="font-size: 0.75rem; color: #6b7280;">${item.source_file.slice(0, 25)}...</td>
                </tr>
            `).join('');
            
            renderPagination(totalPages);
        }
        
        function renderPagination(totalPages) {
            const pagination = document.getElementById('pagination');
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let html = `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;
            
            const maxVisible = 7;
            let start = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let end = Math.min(totalPages, start + maxVisible - 1);
            if (end - start < maxVisible - 1) {
                start = Math.max(1, end - maxVisible + 1);
            }
            
            for (let i = start; i <= end; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            
            html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;
            pagination.innerHTML = html;
        }
        
        function goToPage(page) {
            if (page < 1 || page > Math.ceil(filteredData.length / pageSize)) return;
            currentPage = page;
            renderTable();
        }
        
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
