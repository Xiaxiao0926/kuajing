name: Verify / Deploy Kuajing dashboard

on:
  push:
    branches:
      - main
      - "dev/**"
  workflow_dispatch:

concurrency:
  group: kuajing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ozon-react/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ozon-react ci

      - name: Install PHP lint tool
        run: sudo apt-get update && sudo apt-get install -y php-cli

      - name: Verify business and persistence behavior
        run: |
          npm test
          npm run test:golden
          npm run test:sync
          npm run test:web-persistence
          php -l wordpress/kuajing-persistence/kuajing-persistence.php

      - name: Build dashboard
        env:
          KUAJING_BASE_PATH: ./
        run: npm --prefix ozon-react run build

      - name: Verify scoring production assets (P0 guard)
        run: node scripts/verify-scoring-build.js

      - name: Stage verified WordPress package
        run: |
          rm -rf ozon-react/dist/data
          mkdir -p deploy/kuajing-persistence
          cp wordpress/kuajing-persistence/kuajing-persistence.php deploy/kuajing-persistence/
          cp wordpress/kuajing-persistence/README.md deploy/kuajing-persistence/
          cp -R ozon-react/dist deploy/kuajing-persistence/dist
          printf '%s\n' "${GITHUB_SHA}" > deploy/kuajing-persistence/DEPLOYED_COMMIT

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: kuajing-production-package
          path: deploy/kuajing-persistence
          if-no-files-found: error

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: kuajing-production-package
          path: deploy/kuajing-persistence

      - name: Install FTP deployment tool
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy plugin to Hostinger
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_TARGET_DIR"
          lftp -c "set cmd:fail-exit true; set ssl:verify-certificate no; set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; mirror --reverse --delete --parallel=4 --verbose=1 deploy/kuajing-persistence \"$FTP_TARGET_DIR\""
